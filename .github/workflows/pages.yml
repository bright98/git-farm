name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One build at a time, and let a newer push win: the site is a picture of main,
# so an older build finishing last would publish an older repository.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git-farm reads the whole history and refuses a shallow clone

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Built from this commit rather than downloaded from a release. The page
      # is documentation of the code beside it, so it has to be drawn by that
      # code: a released binary would be describing whatever the last tag did.
      # One script, called from here and from a terminal, so that what you
      # can look at locally and what gets published cannot drift apart.
      - name: build the site
        run: ./docs/build.sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
